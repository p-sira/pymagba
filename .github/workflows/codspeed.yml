name: CodSpeed

on:
  push:
    branches: ["main"]
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  codspeed:
    name: Run benchmarks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Single-threaded instruction counts: stable serial kernel and FFI cost.
          # Multi-threaded Rayon benchmarks are excluded since simulation cannot
          # measure parallel speedups.
          - mode: simulation
            rayon_num_threads: "1"
            pytest_args: '-m "not rayon"'
          # Wall-clock time with Rayon using every available CPU
          # ("0" means Rayon's default), to capture parallel gains.
          - mode: walltime
            rayon_num_threads: "0"
            pytest_args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: uv sync --dev
      - name: Build and install package
        # Keep symbols in benchmark builds so flamegraphs show function names.
        # This does not change the generated code.
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: uv run maturin develop --release
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          RAYON_NUM_THREADS: ${{ matrix.rayon_num_threads }}
        with:
          mode: ${{ matrix.mode }}
          run: uv run pytest python/benchmarks --codspeed ${{ matrix.pytest_args }}
