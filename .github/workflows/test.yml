# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: PyMagba Tests

on:
  workflow_dispatch:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Build and install package
        run: |
          uv run maturin develop
      - name: Verify type stubs are up-to-date
        run: |
          cargo run --bin stub_gen --no-default-features --features stub-gen
          git diff --exit-code python/pymagba/pymagba_binding/__init__.pyi || {
            echo "::error::Python type stubs are out of date! Run 'cargo stub-gen' and commit the updated stub file."
            exit 1
          }
      - name: Run mypy typing check
        run: |
          uv run mypy python/pymagba
      - name: Run tests
        run: |
          uv run pytest -o addopts="" python/tests/
